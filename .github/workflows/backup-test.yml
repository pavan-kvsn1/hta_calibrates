name: Monthly Backup Test

on:
  schedule:
    # First day of each month at 2 AM UTC (7:30 AM IST)
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test backups for'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - prod

env:
  REGION: asia-south1

jobs:
  backup-test:
    name: Test Backup Restore
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: env
        run: |
          # Determine environment
          if [ "${{ github.event_name }}" == "schedule" ]; then
            ENV="prod"
          else
            ENV="${{ github.event.inputs.environment }}"
          fi

          if [ "$ENV" == "prod" ]; then
            echo "project_id=hta-calibration-prod" >> $GITHUB_OUTPUT
            echo "instance=hta-calibration-prod-postgres-prod" >> $GITHUB_OUTPUT
            echo "wif_provider=${{ secrets.GCP_PROD_WIF_PROVIDER }}" >> $GITHUB_OUTPUT
            echo "service_account=${{ secrets.GCP_PROD_SERVICE_ACCOUNT }}" >> $GITHUB_OUTPUT
          else
            echo "project_id=hta-calibration-dev1" >> $GITHUB_OUTPUT
            echo "instance=hta-calibration-dev1-postgres-dev" >> $GITHUB_OUTPUT
            echo "wif_provider=${{ secrets.GCP_DEV_WIF_PROVIDER }}" >> $GITHUB_OUTPUT
            echo "service_account=${{ secrets.GCP_DEV_SERVICE_ACCOUNT }}" >> $GITHUB_OUTPUT
          fi

          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "test_instance=backup-test-$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.env.outputs.wif_provider }}
          service_account: ${{ steps.env.outputs.service_account }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get Latest Backup
        id: backup
        run: |
          echo "Fetching latest backup for ${{ steps.env.outputs.instance }}..."

          BACKUP_INFO=$(gcloud sql backups list \
            --instance=${{ steps.env.outputs.instance }} \
            --project=${{ steps.env.outputs.project_id }} \
            --sort-by=~startTime \
            --limit=1 \
            --format='json' 2>/dev/null || echo "[]")

          if [ "$BACKUP_INFO" == "[]" ]; then
            echo "::error::No backups found for instance ${{ steps.env.outputs.instance }}"
            exit 1
          fi

          BACKUP_ID=$(echo "$BACKUP_INFO" | jq -r '.[0].id')
          BACKUP_TIME=$(echo "$BACKUP_INFO" | jq -r '.[0].startTime')
          BACKUP_STATUS=$(echo "$BACKUP_INFO" | jq -r '.[0].status')

          echo "backup_id=$BACKUP_ID" >> $GITHUB_OUTPUT
          echo "backup_time=$BACKUP_TIME" >> $GITHUB_OUTPUT
          echo "backup_status=$BACKUP_STATUS" >> $GITHUB_OUTPUT

          echo "Found backup:"
          echo "  ID: $BACKUP_ID"
          echo "  Time: $BACKUP_TIME"
          echo "  Status: $BACKUP_STATUS"

          if [ "$BACKUP_STATUS" != "SUCCESSFUL" ]; then
            echo "::warning::Latest backup status is $BACKUP_STATUS, not SUCCESSFUL"
          fi

      - name: Check Backup Age
        run: |
          BACKUP_TIME="${{ steps.backup.outputs.backup_time }}"
          BACKUP_EPOCH=$(date -d "$BACKUP_TIME" +%s)
          NOW_EPOCH=$(date +%s)
          AGE_HOURS=$(( (NOW_EPOCH - BACKUP_EPOCH) / 3600 ))

          echo "Backup age: $AGE_HOURS hours"

          if [ "$AGE_HOURS" -gt 25 ]; then
            echo "::warning::Backup is more than 25 hours old!"
          fi

      - name: Delete Previous Test Instance (if exists)
        run: |
          echo "Cleaning up any existing test instance..."
          gcloud sql instances delete ${{ steps.env.outputs.test_instance }} \
            --project=${{ steps.env.outputs.project_id }} \
            --quiet 2>/dev/null || echo "No existing test instance to delete"

      - name: Create Test Instance from Backup
        id: restore
        run: |
          echo "Creating test instance from backup..."
          echo "This may take 10-15 minutes..."

          # Clone the instance from backup
          gcloud sql instances clone ${{ steps.env.outputs.instance }} \
            ${{ steps.env.outputs.test_instance }} \
            --point-in-time="${{ steps.backup.outputs.backup_time }}" \
            --project=${{ steps.env.outputs.project_id }} \
            --async

          echo "Clone initiated, waiting for completion..."

      - name: Wait for Restore
        id: wait
        timeout-minutes: 30
        run: |
          echo "Waiting for test instance to be ready..."

          for i in {1..60}; do
            STATUS=$(gcloud sql instances describe ${{ steps.env.outputs.test_instance }} \
              --project=${{ steps.env.outputs.project_id }} \
              --format='value(state)' 2>/dev/null || echo "PENDING")

            echo "Attempt $i/60: Status = $STATUS"

            if [ "$STATUS" == "RUNNABLE" ]; then
              echo "Test instance is ready!"
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$STATUS" == "FAILED" ]; then
              echo "::error::Instance restoration failed"
              echo "status=failed" >> $GITHUB_OUTPUT
              exit 1
            fi

            sleep 30
          done

          echo "::error::Timeout waiting for instance"
          echo "status=timeout" >> $GITHUB_OUTPUT
          exit 1

      - name: Get Test Instance IP
        id: instance
        run: |
          IP=$(gcloud sql instances describe ${{ steps.env.outputs.test_instance }} \
            --project=${{ steps.env.outputs.project_id }} \
            --format='value(ipAddresses[0].ipAddress)')

          echo "test_ip=$IP" >> $GITHUB_OUTPUT
          echo "Test instance IP: $IP"

      - name: Verify Data Integrity
        id: verify
        run: |
          echo "Running data integrity checks..."
          echo ""

          # Get connection details
          # Note: In a real scenario, you'd use Cloud SQL Proxy or IAM auth
          # For now, we'll verify the instance is accessible and has data

          # Check instance info
          INSTANCE_INFO=$(gcloud sql instances describe ${{ steps.env.outputs.test_instance }} \
            --project=${{ steps.env.outputs.project_id }} \
            --format='json')

          DISK_SIZE=$(echo "$INSTANCE_INFO" | jq -r '.settings.dataDiskSizeGb')
          DB_VERSION=$(echo "$INSTANCE_INFO" | jq -r '.databaseVersion')

          echo "Instance details:"
          echo "  Database Version: $DB_VERSION"
          echo "  Disk Size: ${DISK_SIZE}GB"

          # List databases
          echo ""
          echo "Databases in instance:"
          gcloud sql databases list \
            --instance=${{ steps.env.outputs.test_instance }} \
            --project=${{ steps.env.outputs.project_id }}

          # Check if our database exists
          DB_EXISTS=$(gcloud sql databases list \
            --instance=${{ steps.env.outputs.test_instance }} \
            --project=${{ steps.env.outputs.project_id }} \
            --format='value(name)' | grep -c "hta_calibration" || echo "0")

          if [ "$DB_EXISTS" -gt 0 ]; then
            echo ""
            echo "✓ hta_calibration database exists"
            echo "integrity=passed" >> $GITHUB_OUTPUT
          else
            echo ""
            echo "::error::hta_calibration database not found!"
            echo "integrity=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Cleanup Test Instance
        if: always()
        run: |
          echo "Cleaning up test instance..."
          gcloud sql instances delete ${{ steps.env.outputs.test_instance }} \
            --project=${{ steps.env.outputs.project_id }} \
            --quiet 2>/dev/null || echo "Cleanup skipped or failed"

      - name: Report Results
        if: always()
        run: |
          echo "## Monthly Backup Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Date** | $(date -u +%Y-%m-%d) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ steps.env.outputs.env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Source Instance** | ${{ steps.env.outputs.instance }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backup ID** | ${{ steps.backup.outputs.backup_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backup Time** | ${{ steps.backup.outputs.backup_time }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Restore Status** | ${{ steps.wait.outputs.status || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Integrity Check** | ${{ steps.verify.outputs.integrity || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Performed" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Latest backup identified" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Backup age verified (<25 hours)" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Restore to test instance" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Database exists verification" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Test instance cleanup" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Backup test failed! Manual investigation required."
          echo ""
          echo "Possible issues:"
          echo "1. No recent backups available"
          echo "2. Backup restoration failed"
          echo "3. Database integrity issues"
          echo ""
          echo "Next steps:"
          echo "1. Check Cloud SQL backup status in GCP Console"
          echo "2. Verify backup schedule is enabled"
          echo "3. Check for any Cloud SQL errors"
