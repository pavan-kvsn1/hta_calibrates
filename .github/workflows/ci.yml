name: CI

on:
  push:
    branches: [main, stage4-auth-users, refactor_repo]
  pull_request:
    branches: [main]

# Cancel previous runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Shared environment variables
  CI: true

jobs:
  # Job 1: Code Quality (runs first, fail fast)
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true  # Report issues but don't block CI (fix incrementally)

      - name: Run TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true  # Report issues but don't block CI (fix incrementally)

      - name: Report code quality status
        run: |
          echo "## Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check ESLint
          if npm run lint 2>&1 | grep -q "error"; then
            LINT_ERRORS=$(npm run lint 2>&1 | grep -c "error" || echo "0")
            echo "### ESLint" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Found lint issues that should be fixed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ESLint" >> $GITHUB_STEP_SUMMARY
            echo "✅ No ESLint errors" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Check TypeScript
          if npx tsc --noEmit 2>&1 | grep -q "error TS"; then
            TS_ERRORS=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || echo "0")
            echo "### TypeScript" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Found $TS_ERRORS type errors that should be fixed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### TypeScript" >> $GITHUB_STEP_SUMMARY
            echo "✅ No TypeScript errors" >> $GITHUB_STEP_SUMMARY
          fi

  # Job 2: Unit Tests (parallel with build, after code-quality)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Unit test summary
        if: always()
        run: |
          echo "## Unit Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests include:" >> $GITHUB_STEP_SUMMARY
          echo "- TAT Calculator" >> $GITHUB_STEP_SUMMARY
          echo "- Feedback Utilities" >> $GITHUB_STEP_SUMMARY
          echo "- Route Guards" >> $GITHUB_STEP_SUMMARY
          echo "- Certificate Status" >> $GITHUB_STEP_SUMMARY
          echo "- Certificate Store" >> $GITHUB_STEP_SUMMARY

  # Job 2a: SQLite Integration Tests
  integration-sqlite:
    name: SQLite Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Setup SQLite database
        run: npx prisma db push
        env:
          DATABASE_URL: file:./test.db

      - name: Run SQLite integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: file:./test.db

      - name: SQLite test summary
        if: always()
        run: |
          echo "## SQLite Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "API integration tests ran against SQLite for:" >> $GITHUB_STEP_SUMMARY
          echo "- Authentication endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- Certificate CRUD operations" >> $GITHUB_STEP_SUMMARY
          echo "- Admin user management" >> $GITHUB_STEP_SUMMARY
          echo "- Customer workflows" >> $GITHUB_STEP_SUMMARY
          echo "- Internal request handling" >> $GITHUB_STEP_SUMMARY
          echo "- Instrument management" >> $GITHUB_STEP_SUMMARY
          echo "- Notification system" >> $GITHUB_STEP_SUMMARY

  # Job 2b: PostgreSQL Integration Tests (production parity)
  integration-postgres:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hta_test
          POSTGRES_PASSWORD: hta_test_password
          POSTGRES_DB: hta_calibration_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hta_test -d hta_calibration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to PostgreSQL
        run: npx prisma db push --schema=prisma/schema.postgres.prisma --accept-data-loss
        env:
          DATABASE_URL: postgresql://hta_test:hta_test_password@localhost:5433/hta_calibration_test

      - name: Run PostgreSQL integration tests
        run: npm run test:integration:postgres
        env:
          DATABASE_URL: postgresql://hta_test:hta_test_password@localhost:5433/hta_calibration_test

      - name: PostgreSQL test summary
        if: always()
        run: |
          echo "## PostgreSQL Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests ran against PostgreSQL 16 for production parity" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This ensures PostgreSQL-specific behaviors are tested:" >> $GITHUB_STEP_SUMMARY
          echo "- Native JSON operators" >> $GITHUB_STEP_SUMMARY
          echo "- Concurrent transaction handling" >> $GITHUB_STEP_SUMMARY
          echo "- Constraint enforcement" >> $GITHUB_STEP_SUMMARY

  # Job 3: Build Check (parallel with unit tests, after code-quality)
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: file:./prisma/build.db

      - name: Build summary
        if: always()
        run: |
          echo "## Build Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Next.js application built successfully" >> $GITHUB_STEP_SUMMARY

  # Job 4: E2E Tests (after unit tests and build pass)
  e2e-tests:
    name: E2E Workflow Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-sqlite, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Setup and seed database
        run: npx prisma db push && npm run db:seed
        env:
          DATABASE_URL: file:${{ github.workspace }}/prisma/test.db

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E workflow tests
        run: npx playwright test --project=chromium
        env:
          DATABASE_URL: file:${{ github.workspace }}/prisma/test.db
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

      - name: E2E test summary
        if: always()
        run: |
          echo "## E2E Workflow Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Workflow Stages Tested:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Workflow | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Engineer Creates Certificate | Form filling, parameters, master instruments |" >> $GITHUB_STEP_SUMMARY
          echo "| 2-3 | Submit & Reviewer Feedback | Submission, reviewer queue, feedback flow |" >> $GITHUB_STEP_SUMMARY
          echo "| 4-5 | Unlock Request | Section unlock, admin review |" >> $GITHUB_STEP_SUMMARY
          echo "| 6-8 | Customer Review | Customer portal, approval, chat |" >> $GITHUB_STEP_SUMMARY
          echo "| 9-12 | Final Approval | Feedback addressing, resubmission |" >> $GITHUB_STEP_SUMMARY
          echo "| 13-16 | Admin Authorization | Requests, instruments, authorization |" >> $GITHUB_STEP_SUMMARY

  # Job 5: Security Scan (after E2E tests pass)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: e2e-tests
    continue-on-error: true  # Don't fail CI for security issues, just report

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Don't fail the build, but report

      - name: Check for known vulnerabilities
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          npm audit --json > audit-results.json 2>/dev/null || true

          # Parse vulnerabilities safely
          if [ -f audit-results.json ]; then
            HIGH=$(cat audit-results.json | jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || echo "0")
            CRITICAL=$(cat audit-results.json | jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || echo "0")
            MODERATE=$(cat audit-results.json | jq '.metadata.vulnerabilities.moderate // 0' 2>/dev/null || echo "0")

            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY

            if [ "$CRITICAL" -gt "0" ] || [ "$HIGH" -gt "0" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Review recommended** - vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ No critical/high vulnerabilities" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Could not parse audit results" >> $GITHUB_STEP_SUMMARY
          fi

  # Final summary job
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, integration-sqlite, integration-postgres, build, e2e-tests, security-scan]
    if: always()

    steps:
      - name: Generate final summary
        run: |
          echo "# CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Count | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | 7 test files | ${{ needs.unit-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration (SQLite) | 12 test files | ${{ needs.integration-sqlite.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration (PostgreSQL) | 12 test files | ${{ needs.integration-postgres.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Workflow Tests | 6 workflow specs | ${{ needs.e2e-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '⚠️ Check warnings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '⚠️ Review needed' }} |" >> $GITHUB_STEP_SUMMARY
