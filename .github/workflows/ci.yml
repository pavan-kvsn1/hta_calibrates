name: CI

on:
  push:
    branches: [main, new-workflow, stage4-auth-users, refactor_repo]
  pull_request:
    branches: [main]

# Cancel previous runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CI: true
  DATABASE_URL: postgresql://hta_test:hta_test_password@localhost:5432/hta_calibration_test

jobs:
  # Job 1: Code Quality (runs first, fail fast)
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hta_test
          POSTGRES_PASSWORD: hta_test_password
          POSTGRES_DB: hta_calibration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hta_test -d hta_calibration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Report code quality status
        run: |
          echo "## Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if npm run lint 2>&1 | grep -q "error"; then
            echo "### ESLint" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Found lint issues that should be fixed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ESLint" >> $GITHUB_STEP_SUMMARY
            echo "✅ No ESLint errors" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if npx tsc --noEmit 2>&1 | grep -q "error TS"; then
            TS_ERRORS=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || echo "0")
            echo "### TypeScript" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Found $TS_ERRORS type errors that should be fixed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### TypeScript" >> $GITHUB_STEP_SUMMARY
            echo "✅ No TypeScript errors" >> $GITHUB_STEP_SUMMARY
          fi

  # Job 2: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hta_test
          POSTGRES_PASSWORD: hta_test_password
          POSTGRES_DB: hta_calibration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hta_test -d hta_calibration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Unit test summary
        if: always()
        run: |
          echo "## Unit Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests include:" >> $GITHUB_STEP_SUMMARY
          echo "- TAT Calculator" >> $GITHUB_STEP_SUMMARY
          echo "- Feedback Utilities" >> $GITHUB_STEP_SUMMARY
          echo "- Route Guards" >> $GITHUB_STEP_SUMMARY
          echo "- Certificate Status" >> $GITHUB_STEP_SUMMARY
          echo "- Certificate Store" >> $GITHUB_STEP_SUMMARY

  # Job 3: Integration Tests (PostgreSQL)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hta_test
          POSTGRES_PASSWORD: hta_test_password
          POSTGRES_DB: hta_calibration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hta_test -d hta_calibration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to PostgreSQL
        run: npx prisma db push --accept-data-loss

      - name: Run integration tests
        run: npm run test:integration

      - name: Integration test summary
        if: always()
        run: |
          echo "## Integration Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests ran against PostgreSQL 16" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "API integration tests include:" >> $GITHUB_STEP_SUMMARY
          echo "- Authentication endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- Certificate CRUD operations" >> $GITHUB_STEP_SUMMARY
          echo "- Admin user management" >> $GITHUB_STEP_SUMMARY
          echo "- Customer workflows" >> $GITHUB_STEP_SUMMARY
          echo "- Internal request handling" >> $GITHUB_STEP_SUMMARY
          echo "- Instrument management" >> $GITHUB_STEP_SUMMARY
          echo "- Notification system" >> $GITHUB_STEP_SUMMARY

  # Job 4: Build Check
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hta_test
          POSTGRES_PASSWORD: hta_test_password
          POSTGRES_DB: hta_calibration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hta_test -d hta_calibration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build application
        run: npm run build

      - name: Build summary
        if: always()
        run: |
          echo "## Build Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Next.js application built successfully" >> $GITHUB_STEP_SUMMARY

  # Job 5: E2E Tests (Sharded for parallelism)
  e2e-tests:
    name: E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, build]
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hta_test
          POSTGRES_PASSWORD: hta_test_password
          POSTGRES_DB: hta_calibration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hta_test -d hta_calibration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Setup and seed database
        run: npx prisma db push --accept-data-loss && npm run db:seed

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Create auth directory
        run: mkdir -p tests/e2e/.auth

      - name: Run E2E tests (sharded)
        run: |
          npx playwright test \
            --project=setup \
            --project=engineer-tests \
            --project=reviewer-tests \
            --project=admin-tests \
            --project=customer-tests \
            --project=public-tests \
            --project=admin-dashboard-tests \
            --project=eval-tests \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots-shard-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7

      - name: E2E test summary
        if: always()
        run: |
          echo "## E2E Workflow Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Workflow Stages Tested:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Workflow | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Engineer Creates Certificate | Form filling, parameters, master instruments |" >> $GITHUB_STEP_SUMMARY
          echo "| 2-3 | Submit & Reviewer Feedback | Submission, reviewer queue, feedback flow |" >> $GITHUB_STEP_SUMMARY
          echo "| 4-5 | Unlock Request | Section unlock, admin review |" >> $GITHUB_STEP_SUMMARY
          echo "| 6-8 | Customer Review | Customer portal, approval, chat |" >> $GITHUB_STEP_SUMMARY
          echo "| 9-12 | Final Approval | Feedback addressing, resubmission |" >> $GITHUB_STEP_SUMMARY
          echo "| 13-16 | Admin Authorization | Requests, instruments, authorization |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Compliance & Evaluation Tests:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Privacy & Terms | Page accessibility, content rendering, mobile responsive |" >> $GITHUB_STEP_SUMMARY
          echo "| Cookie Consent | Banner display, localStorage persistence, acceptance flow |" >> $GITHUB_STEP_SUMMARY
          echo "| Data Export | Download trigger, JSON validation, data completeness |" >> $GITHUB_STEP_SUMMARY
          echo "| Account Deletion | Dialog flow, password validation, error handling |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | WCAG compliance checks |" >> $GITHUB_STEP_SUMMARY
          echo "| Visual Regression | UI screenshot comparisons |" >> $GITHUB_STEP_SUMMARY

  # Job 6: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: e2e-tests
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          npm audit --json > audit-results.json 2>/dev/null || true

          if [ -f audit-results.json ]; then
            HIGH=$(cat audit-results.json | jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || echo "0")
            CRITICAL=$(cat audit-results.json | jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || echo "0")
            MODERATE=$(cat audit-results.json | jq '.metadata.vulnerabilities.moderate // 0' 2>/dev/null || echo "0")

            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY

            if [ "$CRITICAL" -gt "0" ] || [ "$HIGH" -gt "0" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Review recommended** - vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ No critical/high vulnerabilities" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Could not parse audit results" >> $GITHUB_STEP_SUMMARY
          fi

  # Final summary job
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, integration-tests, build, e2e-tests, security-scan]
    if: always()

    steps:
      - name: Generate final summary
        run: |
          echo "# CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests (PostgreSQL) | ${{ needs.integration-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Workflow Tests | ${{ needs.e2e-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compliance Tests (GDPR) | ${{ needs.e2e-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '⚠️ Check warnings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '⚠️ Review needed' }} |" >> $GITHUB_STEP_SUMMARY
