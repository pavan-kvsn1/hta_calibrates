# Docker Compose for Local Development
# Usage: docker compose -f docker-compose.dev.yml up
#
# Prerequisites:
# 1. Docker and Docker Compose installed
# 2. Copy .env.example to .env and configure

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hta-postgres
    environment:
      POSTGRES_USER: hta_user
      POSTGRES_PASSWORD: hta_dev_password
      POSTGRES_DB: hta_calibration
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hta_user -d hta_calibration"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hta-network

  # HTA Calibration Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hta-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hta_user:hta_dev_password@postgres:5432/hta_calibration
      NEXTAUTH_SECRET: dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    networks:
      - hta-network
    # For development with hot reload, uncomment volumes below:
    # volumes:
    #   - ./src:/app/src:ro
    #   - ./public:/app/public:ro

  # OpenSign (Optional - for digital signature functionality)
  # Uncomment if you need to run OpenSign locally
  #
  # opensign-ui:
  #   image: opensignlabs/opensign:latest
  #   container_name: opensign-ui
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8080
  #   depends_on:
  #     - opensign-api
  #   networks:
  #     - hta-network
  #
  # opensign-api:
  #   image: opensignlabs/opensign-server:latest
  #   container_name: opensign-api
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     MONGODB_URI: mongodb://mongodb:27017/opensign
  #   depends_on:
  #     - mongodb
  #   networks:
  #     - hta-network
  #
  # mongodb:
  #   image: mongo:7
  #   container_name: opensign-mongodb
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodata:/data/db
  #   networks:
  #     - hta-network

networks:
  hta-network:
    driver: bridge

volumes:
  pgdata:
  # mongodata:  # Uncomment if using OpenSign
