# External Secrets patch for Development environment
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: hta-calibration
spec:
  provider:
    gcpsm:
      projectID: hta-calibration-dev1

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hta-secrets
  namespace: hta-calibration
spec:
  data:
    - secretKey: database-url
      remoteRef:
        key: hta-calibration-dev1-database-url-dev
        version: latest
    - secretKey: nextauth-secret
      remoteRef:
        key: hta-calibration-dev1-nextauth-secret-dev
        version: latest
    - secretKey: redis-url
      remoteRef:
        key: hta-calibration-dev1-redis-url-dev
        version: latest
    - secretKey: resend-api-key
      remoteRef:
        key: hta-calibration-dev1-resend-api-key-dev
        version: latest
    - secretKey: email-from
      remoteRef:
        key: hta-calibration-dev1-email-from-dev
        version: latest
