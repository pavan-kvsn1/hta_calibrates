# External Secrets patch for Staging environment
# NOTE: Update project ID if staging uses a different GCP project
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: hta-calibration
spec:
  provider:
    gcpsm:
      projectID: hta-calibration-prod  # Update if using separate staging project

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hta-secrets
  namespace: hta-calibration
spec:
  data:
    - secretKey: database-url
      remoteRef:
        key: hta-calibration-prod-database-url-staging
        version: latest
    - secretKey: nextauth-secret
      remoteRef:
        key: hta-calibration-prod-nextauth-secret-staging
        version: latest
    - secretKey: redis-url
      remoteRef:
        key: hta-calibration-prod-redis-url-staging
        version: latest
    - secretKey: resend-api-key
      remoteRef:
        key: hta-calibration-prod-resend-api-key-staging
        version: latest
    - secretKey: email-from
      remoteRef:
        key: hta-calibration-prod-email-from-staging
        version: latest
