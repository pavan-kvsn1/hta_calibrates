# External Secrets patch for Production environment
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: hta-calibration
spec:
  provider:
    gcpsm:
      projectID: hta-calibration-prod

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hta-secrets
  namespace: hta-calibration
spec:
  data:
    - secretKey: database-url
      remoteRef:
        key: hta-calibration-prod-database-url-prod
        version: latest
    - secretKey: nextauth-secret
      remoteRef:
        key: hta-calibration-prod-nextauth-secret-prod
        version: latest
    - secretKey: redis-url
      remoteRef:
        key: hta-calibration-prod-redis-url-prod
        version: latest
    - secretKey: resend-api-key
      remoteRef:
        key: hta-calibration-prod-resend-api-key-prod
        version: latest
    - secretKey: email-from
      remoteRef:
        key: hta-calibration-prod-email-from-prod
        version: latest
