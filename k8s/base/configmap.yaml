apiVersion: v1
kind: ConfigMap
metadata:
  name: hta-config
  namespace: hta-calibration
  labels:
    app.kubernetes.io/name: hta-calibration
    app.kubernetes.io/part-of: hta-calibration
data:
  # Base values - overridden by environment overlays
  NODE_ENV: "production"
  PORT: "3000"
  AUTH_TRUST_HOST: "true"
  # These MUST be set in overlay patches:
  NEXTAUTH_URL: "https://REPLACE_IN_OVERLAY"
  AUTH_URL: "https://REPLACE_IN_OVERLAY"
  GCS_CERTIFICATES_BUCKET: "REPLACE_IN_OVERLAY"
  GCS_SIGNATURES_BUCKET: "REPLACE_IN_OVERLAY"
  GCS_UPLOADS_BUCKET: "REPLACE_IN_OVERLAY"
