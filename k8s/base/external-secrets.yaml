# External Secrets - Syncs secrets from GCP Secret Manager to K8s
# Requires External Secrets Operator to be installed in the cluster:
# helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace

---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: hta-calibration
spec:
  provider:
    gcpsm:
      # Uses Workload Identity - no explicit credentials needed
      # The K8s ServiceAccount (hta-app) is bound to a GCP Service Account
      projectID: REPLACE_PROJECT_ID  # Override in overlay

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hta-secrets
  namespace: hta-calibration
  labels:
    app.kubernetes.io/name: hta-calibration
    app.kubernetes.io/part-of: hta-calibration
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: hta-secrets
    creationPolicy: Owner
  data:
    # Database connection string
    - secretKey: database-url
      remoteRef:
        key: REPLACE_PROJECT_ID-database-url-REPLACE_ENV  # Override in overlay
        version: latest

    # NextAuth.js session secret
    - secretKey: nextauth-secret
      remoteRef:
        key: REPLACE_PROJECT_ID-nextauth-secret-REPLACE_ENV  # Override in overlay
        version: latest

    # Redis URL (optional - for caching)
    - secretKey: redis-url
      remoteRef:
        key: REPLACE_PROJECT_ID-redis-url-REPLACE_ENV  # Override in overlay
        version: latest

    # Resend API key (for emails)
    - secretKey: resend-api-key
      remoteRef:
        key: REPLACE_PROJECT_ID-resend-api-key-REPLACE_ENV  # Override in overlay
        version: latest

    # Email sender address
    - secretKey: email-from
      remoteRef:
        key: REPLACE_PROJECT_ID-email-from-REPLACE_ENV  # Override in overlay
        version: latest
