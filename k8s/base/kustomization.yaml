apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: hta-calibration-base

namespace: hta-calibration

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
