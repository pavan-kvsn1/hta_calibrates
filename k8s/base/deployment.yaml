apiVersion: apps/v1
kind: Deployment
metadata:
  name: hta-web
  namespace: hta-calibration
  labels:
    app.kubernetes.io/name: hta-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: hta-calibration
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hta-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hta-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: hta-calibration
    spec:
      serviceAccountName: hta-app
      containers:
        - name: hta-web
          image: asia-south1-docker.pkg.dev/hta-calibration-dev1/hta-calibration/app:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hta-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hta-secrets
                  key: database-url
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hta-secrets
                  key: nextauth-secret
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hta-secrets
                  key: nextauth-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: hta-web
                topologyKey: kubernetes.io/hostname
